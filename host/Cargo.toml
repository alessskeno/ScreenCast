[package]
name = "mirror-host"
version = "0.1.0"
edition = "2021"
description = "Kablosuz ikinci ekran — Windows yayın ucu (DXGI yakalama → donanım H.264 → WebRTC)"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webrtc = "0.12"
cpal = "0.15"
opus = "0.3"
windows-core = "0.61"
# glow (OpenGL) arka ucu: varsayılan wgpu, farklı bir windows crate sürümü çekip
# derlemeyi kırıyor; panel için glow fazlasıyla yeterli.
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow"] }

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell_PropertiesSystem",
]
