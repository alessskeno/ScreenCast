[package]
name = "mirror-host"
version = "0.4.1"
edition = "2021"
description = "Kablosuz ikinci ekran — yayın ucu (Windows: DXGI/ffmpeg, Linux: PipeWire/GStreamer → H.264 → WebRTC)"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webrtc = "0.12"
opus = "0.3"
# glow (OpenGL) arka ucu: varsayılan wgpu, farklı bir windows crate sürümü çekip
# derlemeyi kırıyor; panel için glow fazlasıyla yeterli.
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow"] }

# --- Windows'a özel ---
[target.'cfg(windows)'.dependencies]
# WASAPI loopback yalnız Windows yolunda kullanılır; Linux'ta ses PipeWire'dan
# (GStreamer pulsesrc monitörü) gelir, bu yüzden cpal/ALSA bağımlılığı gerekmez.
cpal = "0.15"
windows-core = "0.61"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell_PropertiesSystem",
]

# --- Linux'a özel ---
[target.'cfg(target_os = "linux")'.dependencies]
# Ekran yakalama izni/oturumu D-Bus üzerinden alınır (Mutter ScreenCast):
# sanal monitör (--extend) ve monitör listesi de buradan gelir.
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# prctl(PR_SET_PDEATHSIG): alt süreçler ebeveyn ölünce kesin ölsün.
libc = "0.2"
# eframe/winit'in Linux pencere arka uçları (default-features=false olduğu için
# elle açılmalı; yoksa panel "no display backend" ile açılmaz).
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
